[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "airlock-mcp"
version = "0.1.0"
description = "Evidence-led MCP connector auditing and policy enforcement backend"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.128,<0.129",
  "httpx>=0.28,<0.29",
  "httpx2>=2.12,<3",
  "httpcore>=1,<2",
  "httpcore2>=2.12,<3",
  "jsonschema>=4.25,<5",
  "mcp==2.1.1",
  "pydantic>=2.12,<3",
  "uvicorn>=0.39,<0.40",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10",
]

[project.scripts]
airlock-backend = "airlock.main:run"

[tool.setuptools.packages.find]
include = ["airlock*"]

[tool.setuptools.package-data]
airlock = ["ui/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
